<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Briefcase/Portfolio icon -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#863bff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5b2c91;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Briefcase body -->
  <rect x="12" y="20" width="40" height="28" rx="2" fill="url(#grad)" stroke="#4a1f5f" stroke-width="1"/>
  
  <!-- Briefcase handle -->
  <path d="M 20 20 Q 20 8 32 8 Q 44 8 44 20" fill="none" stroke="url(#grad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Briefcase divider/lock -->
  <rect x="30" y="18" width="4" height="6" rx="1" fill="#4a1f5f"/>
  
  <!-- Top accent line -->
  <line x1="12" y1="20" x2="52" y2="20" stroke="#ede6ff" stroke-width="1" opacity="0.5"/>
</svg>